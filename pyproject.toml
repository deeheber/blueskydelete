[project]
name = "blueskydelete"
version = "0.1.0"
requires-python = ">=3.13"
authors = [
  {name = "Danielle Heberling"}
]
dependencies = [
  "atproto>=0.0.67,<0.1"
]

[dependency-groups]
dev = [
    "black>=26.5.1,<26.6",
    "mypy>=2.1.0,<2.2",
    "ruff>=0.15.16,<0.16"
]

[tool.uv]
required-version = ">=0.11.19,<0.12"

[tool.black]
line-length = 79
# pin target: open-ended requires-python would otherwise infer py315
target-version = ['py313']

[tool.mypy]
python_version = "3.13"
strict = true
# not included in strict
warn_unused_configs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "atproto"
ignore_missing_imports = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["blueskydelete"]