[project]
name = "blueskydelete"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
authors = [
  {name = "Danielle Heberling"}
]
dependencies = [
  "atproto>=0.0.72,<0.1"
]

[dependency-groups]
dev = [
    "mypy>=2.4.0,<2.5",
    "ruff>=0.17.2,<0.18"
]

[tool.uv]
required-version = ">=0.13.5,<0.14"

[tool.mypy]
python_version = "3.14"
strict = true
# not included in strict
warn_unused_configs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "atproto"
ignore_missing_imports = true

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
preview = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length is managed by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["blueskydelete"]
